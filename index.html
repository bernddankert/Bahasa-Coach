const DEEP={
0:{rule:'Begrüssungen hängen von Tageszeit und Situation ab. „Selamat pagi“ ist morgens üblich, „selamat siang“ ungefähr mittags/frühnachmittags, „selamat sore“ später nachmittags. „Selamat malam“ bedeutet guten Abend; zum Schlafengehen sagt man „selamat tidur“. „Apa kabar?“ ist eine freundliche Nachfrage.',informal:'Halo! Apa kabar? — Baik, makasih. Kamu?',formal:'Selamat pagi. Apa kabar? — Baik, terima kasih.',pitfall:'„Selamat malam“ nicht automatisch als „Gute Nacht“ beim Zubettgehen verwenden.',task:'Sprechen Sie eine Begrüssung morgens und eine beim Zubettgehen laut aus.'},
1:{rule:'„Saya“ ist neutral/höflich, „aku“ vertrauter. „Kamu“ wird informell verwendet; „Anda“ ist distanziert/formell. „Kita“ schliesst die angesprochene Person ein, „kami“ schliesst sie aus. Verben werden nicht nach Personen gebeugt.',informal:'Aku mau makan. Kamu ikut? — Ayo!',formal:'Saya ingin bertanya. Apakah Anda punya waktu?',pitfall:'„Kita“ und „kami“ nicht verwechseln: Bei „Wir gehen zusammen“ mit dem Gesprächspartner ist „kita“ richtig.',task:'Bilden Sie je einen Satz mit saya, aku, kita und kami.'},
2:{rule:'Besitz wird nachgestellt: „rumah saya“ (mein Haus), „anak saya“ (mein Kind). Im vertrauten Gespräch sind Endungen wie -ku und -mu üblich: „ibuku“ (meine Mutter), „mainanmu“ (dein Spielzeug).',informal:'Ini mainanmu? — Iya, itu mainanku.',formal:'Ini rumah keluarga saya.',pitfall:'Nicht Wort für Wort aus dem Deutschen „mein Haus“ übersetzen; das Besitzwort folgt dem Nomen.',task:'Beschreiben Sie drei Personen aus Ihrer Familie.'},
3:{rule:'Zahlen: 11 = sebelas, 12 = dua belas, 20 = dua puluh, 21 = dua puluh satu, 100 = seratus. Für Mengen gibt es Zähleinheiten, z. B. „dua orang“ für zwei Personen.',informal:'Ada tiga telur di kulkas.',formal:'Saya ingin membeli dua kilogram beras.',pitfall:'„Sepuluh“ ist zehn, „seratus“ hundert; „satu puluh“ ist nicht die übliche Form.',task:'Zählen Sie von 1 bis 20 und nennen Sie drei Preise.'},
4:{rule:'Das Verb bleibt gleich: „saya makan“, „dia makan“, „kami makan“. Zeit wird über Kontext und Wörter ausgedrückt: „sedang“ (gerade), „sudah“ (bereits), „akan“ (zukünftig). „Tidak“ verneint Verben und Adjektive.',informal:'Aku lagi makan. Nanti ya!',formal:'Saya sedang makan. Saya akan menelepon nanti.',pitfall:'„Sudah“ bedeutet nicht immer eine grammatische Vergangenheit, sondern betont oft den abgeschlossenen Zustand.',task:'Sagen Sie: Ich esse gerade; sie hat schon gegessen; wir werden morgen essen.'},
5:{rule:'Für Ja/Nein-Fragen ist in formeller Sprache „apakah“ möglich. In Gesprächen reicht häufig die Intonation: „Kamu sudah makan?“ Fragewörter sind „apa“, „siapa“, „di mana“, „kapan“, „kenapa“ (umgangssprachlich warum).',informal:'Kamu di mana? — Di rumah.',formal:'Apakah Anda sudah menerima pesan saya?',pitfall:'„Tidak“ verneint Verben/Adjektive; „bukan“ verneint die Identität oder Zuordnung von Nomen.',task:'Stellen Sie vier Fragen zu Ort, Person, Zeit und Tätigkeit.'},
6:{rule:'„Sudah“ = schon, „belum“ = noch nicht, „sedang“ = gerade. „Besok“ bedeutet morgen; „kemarin“ gestern. „Nanti“ ist später, ohne genaue Uhrzeit. Tageszeiten werden in der Regel ohne Verbkonjugation kombiniert.',informal:'Udah mandi belum? — Belum, nanti.',formal:'Apakah Anda sudah selesai? — Belum.',pitfall:'„Belum“ ist nicht einfach „tidak“: Es impliziert, dass etwas noch aussteht.',task:'Beschreiben Sie morgens, mittags und abends Ihren Tagesablauf.'},
7:{rule:'„Mau“ ist im Alltag häufig für „möchten/wollen“. „Ingin“ wirkt oft etwas formeller. „Tolong“ leitet höfliche Bitten ein. Beim gemeinsamen Essen ist „ayo makan“ natürlich.',informal:'Mau makan apa? — Aku mau nasi goreng.',formal:'Saya ingin memesan air putih, tolong.',pitfall:'„Air“ bedeutet Wasser (nicht Luft); „air putih“ meint gewöhnliches Trinkwasser.',task:'Bestellen Sie ein Getränk und fragen Sie nach dem Essen.'},
10:{rule:'Bei kurzen Aufforderungen ist der Tonfall wichtig. „Ayo“ lädt ein, „tolong“ macht eine Bitte höflicher. „Sudah ...?“ fragt nach einer abgeschlossenen Handlung. „Jangan“ bedeutet „nicht!“ bei Verboten.',informal:'Ayo, cuci tangan dulu! Habis itu kita makan.',formal:'Tolong cuci tangan sebelum makan.',pitfall:'„Sudah mandi?“ fragt „Schon geduscht?“; „Mandi sekarang!“ ist eine direkte Aufforderung.',task:'Sprechen Sie drei freundliche Aufforderungen aus dem Familienalltag.'}
};

function home(){let c=counts(),accuracy=c.attempts?Math.round(c.correct/c.attempts*100):0;return `<div class="panel"><div class="flex"><div><span class="pill">DE → ID 80 % · ID → DE 20 %</span><h2>Heute Indonesisch lernen</h2><div class="muted">15 Minuten · Wiederholen vor Neulernen</div></div><div style="font-size:42px">📚</div></div><button class="primary full" onclick="startCards()">▶ Jetzt lernen</button><button class="outline full" onclick="startWordCards()">Nur Wörter lernen</button><button class="outline full" onclick="go('vocabulary')">Wortschatz suchen</button></div><div class="stats"><div class="stat"><div class="num">${c.learned}</div><div class="small muted">Karten begonnen</div></div><div class="stat"><div class="num">${c.due}</div><div class="small muted">Wiederholungen fällig</div></div><div class="stat"><div class="num">${accuracy}%</div><div class="small muted">Trefferquote</div></div><div class="stat"><div class="num">${c.mastered}</div><div class="small muted">Langfristig gelernt</div></div></div><div class="panel" style="margin-top:15px"><h3>Dein nächstes Kapitel</h3>${chapterBlock(chapters.find(ch=>!state.completed.includes(ch.id))||chapters[0])}</div><div class="panel"><h3>Dein Lernsystem</h3><p class="notice">Neue Wörter, Grammatik und ganze Sätze werden in einer Karteikarte gespeichert. Fehler kommen früher zurück. Sichere Antworten bekommen längere Intervalle. Die tägliche Auswahl enthält etwa 80 % aktive Übersetzung ins Indonesische.</p><button class="outline full" onclick="go('practice')">Weitere Übungen entdecken</button></div>`}
function chapterBlock(ch){let done=ch.cards.filter(c=>state.reviews[c.id]).length;return `<div class="chapter"><div class="n">${ch.id+1}</div><div class="info"><b>${escaped(ch.title)}</b><div class="small muted">${ch.level} · ${ch.cards.length} Karten · ${done} begonnen</div><div class="bar" style="margin-top:6px"><i style="width:${100*done/ch.cards.length}%"></i></div></div><button onclick="openChapter(${ch.id})">Öffnen</button></div>`}function course(){return `<div class="panel"><p class="notice">Wortschatz V13: Mehrdeutigkeiten und Glossen redaktionell überarbeitet; Einzelwort-Suche ergänzt. Keine unabhängige Muttersprachler- oder Korpusprüfung. A1–B2 ist weiterhin ein Lernpfad, kein zertifizierter Vollkurs. Die Stufen sind eine Kursstruktur, keine zertifizierte CEFR-Einstufung.</p><select class="select" onchange="document.getElementById('chapterlist').innerHTML=chapterList(this.value)"><option value="all">Alle Stufen</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option></select></div><div id="chapterlist">${chapterList('all')}</div>`}function chapterList(level){return chapters.filter(c=>level==='all'||c.level===level).map(c=>`<div class="panel">${chapterBlock(c)}</div>`).join('')}function openChapter(i){activeChapter=i;tab='course';let c=chapters[i];document.getElementById('main').innerHTML=`<button onclick="render()">← Alle Kapitel</button><div class="panel"><span class="pill">${c.level} · Kapitel ${i+1}</span><h2>${escaped(c.title)}</h2><p>${escaped(c.goal)}</p><h3>📖 Grammatik & Sprachhinweis</h3>${lessonPanel(c)}<div class="panel" style="background:#fff7f7"><b>Grammatik im Kontext</b><p>${escaped(c.goal)}. Lernen Sie die Regel anhand dieser Beispielsätze:</p>${c.cards.filter(x=>x.type==='Satz').slice(0,3).map(x=>`<p><b>${escaped(x.id)}</b><br><span class="muted">${escaped(x.de)}</span></p>`).join('')}<button onclick="startGrammar(${i})">Grammatik üben →</button></div><div class="grid2"><button class="primary" onclick="startCards(${i})">Karten lernen</button><button onclick="startQuiz(${i})">Kapiteltest</button></div><button class="outline full" onclick="toggleComplete(${i})">${state.completed.includes(i)?'✓ Als abgeschlossen markiert':'Kapitel als abgeschlossen markieren'}</button></div><div class="panel"><h3>Wortschatz und Sätze (${c.cards.length})</h3><div class="wordlist">${c.cards.map(x=>`<div class="wordrow flex"><div><b>${escaped(x.id)}</b><span class="muted small">${escaped(x.de)} · ${x.type}</span></div><button onclick="speak('${x.id.replace(/'/g,"\\'")}')">🔊</button></div>`).join('')}</div></div>`}function toggleComplete(i){if(state.completed.includes(i))state.completed=state.completed.filter(x=>x!==i);else state.completed.push(i);save();openChapter(i)}
function makeSession(chapter){let source=chapter===undefined?cards:chapters[chapter].cards;let scheduled=source.filter(c=>state.reviews[c.id]&&due(c)).sort((a,b)=>state.reviews[a.id].due-state.reviews[b.id].due);let dayNew=state.log.filter(l=>l.type==='card'&&l.first&&new Date(l.at).toLocaleDateString('en-CA')===today()).length;let newcomers=source.filter(c=>!state.reviews[c.id]&&(chapter!==undefined||c.chapter<=activeChapter)).slice(0,Math.max(0,state.settings.newDaily-dayNew));return [...scheduled,...newcomers].slice(0,45)}function startCards(chapter){session=makeSession(chapter);index=0;flipped=false;tab='cards';render()}function cardview(){if(!session.length)return `<div class="panel"><h3>Intelligente Karteikarten</h3><p class="notice">Wiederholungen haben Vorrang. Neue Karten kommen aus dem Lernpfad hinzu. Bewerten Sie erst, nachdem Sie die Antwort gesehen haben.</p><button class="primary full" onclick="startCards()">Tagestraining starten</button><button class="outline full" onclick="startCards(${Math.min(activeChapter,chapters.length-1)})">Aktuelles Kapitel trainieren</button></div>`;if(index>=session.length)return `<div class="panel"><h2>🎉 Training abgeschlossen!</h2><p>Ihre Bewertungen wurden gespeichert. Fällige Karten erscheinen zum nächsten Wiederholungstermin.</p><button class="primary full" onclick="session=[];go('home')">Zum Cockpit</button></div>`;let c=session[index],reverse=(index%5===4),front=reverse?c.id:c.de,back=reverse?c.de:c.id;return `<div class="panel"><div class="flex"><span class="pill">${reverse?'ID → DE':'DE → ID'}</span><span class="small muted">${index+1} / ${session.length}</span></div><div class="bar" style="margin:12px 0"><i style="width:${index/session.length*100}%"></i></div><div class="cardface" onclick="flip()"><div class="small muted">${flipped?'ANTWORT':'ÜBERSETZEN'}</div><div class="word">${escaped(flipped?back:front)}</div><div class="small muted">${flipped?'Bewerten Sie Ihre Erinnerung':'Antippen zum Umdrehen'}</div></div>${flipped?`<div class="flex" style="margin-top:12px"><button onclick="speak(session[index].id)">🔊 Aussprache</button><button onclick="listen('${c.id.replace(/'/g,"\\'")}')">🎤 Nachsprechen</button></div><div id="speechResult"></div><div class="rating"><button onclick="rate(0)">Nochmal</button><button onclick="rate(1)">Schwer</button><button onclick="rate(2)">Gut</button><button onclick="rate(3)">Einfach</button></div>`:`<button class="primary full" onclick="flip()">Antwort zeigen</button>`}</div><div class="panel"><span class="small muted">${escaped(chapters[c.chapter].title)} · ${c.type}</span><p class="notice">Nochmal = nicht gewusst · Schwer = mit Mühe erinnert · Gut = korrekt · Einfach = sofort gewusst.</p></div>`}function flip(){flipped=!flipped;render()}// FSRS-4.5 reference equations, 17 published default weights; fixed preset until personal optimization.
const FSRS_W=[0.4,0.6,2.4,5.8,4.93,0.94,0.86,0.01,1.49,0.14,0.94,2.18,0.05,0.34,1.26,0.29,2.61];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fsrsInterval(stability){let desired=clamp((state.settings.retention||90)/100,.7,.97);return Math.max(1,Math.round(stability*(state.settings.stabilityFactor||1)*9*(1/desired-1)))}
function fsrsNext(prev,grade,now){let w=FSRS_W, s,d,elapsed=0;const initD=g=>clamp(w[4]-Math.exp(w[5]*(g-1))+1,1,10);
 if(!prev){s=w[grade-1];d=initD(grade)}else{let old=prev.fsrs;elapsed=Math.max(0,(now-(old.lastReview||now))/86400000);let R=Math.pow(1+elapsed/(9*Math.max(.1,old.stability)),-1);let D=old.difficulty,S=old.stability;
 if(grade===1){s=w[11]*Math.pow(D,-w[12])*(Math.pow(S+1,w[13])-1)*Math.exp(w[14]*(1-R));s=Math.min(s,S)}
 else{s=S*(1+Math.exp(w[8])*(11-D)*Math.pow(S,-w[9])*(Math.exp(w[10]*(1-R))-1)*(grade===2?w[15]:1)*(grade===4?w[16]:1))}
 d=clamp(w[7]*initD(4)+(1-w[7])*(D-w[6]*(grade-3)),1,10);
 }
 s=clamp(s,.1,36500);let interval=fsrsInterval(s);
 return {stability:s,difficulty:d,lastReview:now,scheduledDays:interval,grade,version:'FSRS-4.5'};
}
function rate(rating){let c=session[index],prev=state.reviews[c.id],now=Date.now(),first=!prev,grade=rating+1;
 // Existing legacy reviews cannot be converted exactly; preserve historical log, start a fresh FSRS state.
 let oldFsrs=prev?.fsrs?prev:null;
 let fsrs=fsrsNext(oldFsrs,grade,now);let prevStability=oldFsrs?.fsrs?.stability||null, elapsedDays=oldFsrs?.fsrs?Math.max(0,(now-oldFsrs.fsrs.lastReview)/86400000):null;
 let learning=grade===1?10:grade===2&&(!prev||prev.learning)?10:0;
 let dueAt=now+(learning?learning*60000:fsrs.scheduledDays*86400000);
 let record={...(prev||{}),lastRating:rating,fsrs,interval:learning?0:fsrs.scheduledDays,learning:!!learning,due:dueAt,last:now,reps:(prev?.reps||0)+1,correct:(prev?.correct||0)+(grade>=3?1:0),lapses:(prev?.lapses||0)+(grade===1?1:0)};
 state.reviews[c.id]=record;state.log.push({type:'card',id:c.id,cardType:c.type,rating,at:now,first,direction:studyDirection,fsrs:true,prevStability,elapsedDays});save();
 // Reinsert forgotten cards later in this session without infinite loops.
 if(grade===1&&session.filter(x=>x.id===c.id).length<3)session.splice(Math.min(index+4,session.length),0,c);
 index++;flipped=false;render();
}
function practice(){return `<div class="panel"><h3>✍️ Übersetzungstest</h3><p class="notice">Schreiben Sie die indonesische Übersetzung selbst. Die App vergleicht Ihre Antwort und zeigt die korrekte Lösung.</p><button class="primary full" onclick="startQuiz()">Gemischten Test starten</button></div><div class="panel"><h3>🎧 Hörverständnis</h3><p class="notice">Hören Sie indonesische Wörter und schreiben Sie die deutsche Bedeutung. Benötigt eine indonesische Systemstimme.</p><button class="outline full" onclick="startListening()">Hörtraining starten</button></div><div class="panel"><h3>🗣️ Sprechen</h3><p class="notice">Bei Karteikarten können Sie die Aussprache anhören und nachsprechen. Spracherkennung ist browserabhängig und keine präzise Aussprachebewertung.</p><button class="outline full" onclick="startCards()">Sprechkarten öffnen</button></div><div class="panel"><h3>📚 Kapiteltests</h3><p class="notice">Öffnen Sie ein Kapitel und wählen Sie „Kapiteltest“, um dessen Wortschatz zu überprüfen.</p><button class="outline full" onclick="go('course')">Zum Lernpfad</button></div>`}function startQuiz(chapter,listening=false){let source=chapter===undefined?cards:chapters[chapter].cards;quiz=[...source].sort(()=>Math.random()-.5).slice(0,10);quizIndex=0;quizScore=0;quizAnswered=false;tab='practice';renderQuiz(listening)}function startListening(){startQuiz(undefined,true)}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[!?.,]/g,'').replace(/\s+/g,' ').trim()}function renderQuiz(listening=false){if(quizIndex>=quiz.length){state.log.push({type:'quiz',score:quizScore,total:quiz.length,at:Date.now()});save();document.getElementById('main').innerHTML=`<div class="panel"><h2>Test beendet 🎯</h2><div class="num">${quizScore} / ${quiz.length}</div><p>Ihre Antworten wurden in der Statistik erfasst.</p><button class="primary full" onclick="go('practice')">Weiter üben</button></div>`;return}let c=quiz[quizIndex];document.getElementById('main').innerHTML=`<div class="panel"><span class="pill">${listening?'Hörverständnis':'Übersetzung'} · ${quizIndex+1}/${quiz.length}</span><div class="question">${listening?'🔊 Höre und übersetze':escaped(c.de)}</div>${listening?`<button onclick="speak(quiz[quizIndex].id)">▶ Abspielen</button>`:''}<input id="answer" class="input" autocomplete="off" autocapitalize="off" placeholder="${listening?'Deutsch':'Indonesisch'} eingeben" onkeydown="if(event.key==='Enter')checkQuiz(${listening})"><div id="feedback"></div><button class="primary full" id="check" onclick="checkQuiz(${listening})">Prüfen</button><button class="outline full hidden" id="next" onclick="quizIndex++;quizAnswered=false;renderQuiz(${listening})">Nächste Frage →</button></div>`}function checkQuiz(listening){if(quizAnswered)return;let c=quiz[quizIndex],value=document.getElementById('answer').value,expected=listening?c.de:c.id,ok=norm(value)===norm(expected);if(ok)quizScore++;state.log.push({type:'answer',cardId:c.id,correct:ok,at:Date.now(),mode:listening?'listening':'translation'});save();quizAnswered=true;document.getElementById('feedback').innerHTML=`<div class="answer"><b>${ok?'✓ Richtig!':'Noch nicht richtig'}</b><br>Richtige Antwort: ${escaped(expected)}</div>`;document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden')}
function listen(expected){let Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){toast('Spracherkennung in diesem Browser nicht verfügbar');return}let rec=new Recognition();rec.lang='id-ID';rec.interimResults=false;rec.onresult=e=>{let heard=e.results[0][0].transcript,match=compareSpeech(expected,heard);state.log.push({type:'speech',expected,heard,match,at:Date.now()});save();let area=document.getElementById('speechResult');if(area)area.innerHTML=`<p class="notice"><b>Erkannt:</b> ${escaped(heard)}<br><b>Ziel:</b> ${escaped(expected)}<br><b>Textübereinstimmung:</b> ${match}%<br><small>Keine phonetische Aussprachebewertung. Die Erkennung kann auch bei korrekter Aussprache abweichen.</small></p>`;else toast('Erkannt: '+heard+' · '+match+'% Texttreffer')};rec.onerror=()=>toast('Mikrofon oder Erkennung nicht verfügbar');try{rec.start();toast('Bitte jetzt sprechen …')}catch(e){toast('Mikrofon nicht verfügbar')}}

function calibrationData(){return state.log.filter(x=>x.type==='card'&&x.prevStability>0&&x.elapsedDays>=.5&&Number.isFinite(x.elapsedDays)&&x.rating>=0)}
function optimizePersonal(){let data=calibrationData(),days=new Set(data.map(x=>new Date(x.at).toISOString().slice(0,10))).size;if(data.length<50||days<7){toast(`Noch ${Math.max(0,50-data.length)} geeignete Reviews; mindestens 7 Lerntage nötig (${days}/7)`);return}let best=1,bestLoss=Infinity;for(let f=.55;f<=1.81;f+=.01){let loss=0;for(let x of data){let p=Math.max(.001,Math.min(.999,Math.pow(1+x.elapsedDays/(9*x.prevStability*f),-1)));let y=x.rating===0?0:1;loss-=y*Math.log(p)+(1-y)*Math.log(1-p)}loss+=3*Math.pow(Math.log(f),2);if(loss<bestLoss){bestLoss=loss;best=f}}state.settings.stabilityFactor=Math.round(best*100)/100;state.settings.calibratedAt=Date.now();save();render();toast('Persönliche Kalibrierung aktualisiert')}
function calibrationPanel(){let d=calibrationData(),days=new Set(d.map(x=>new Date(x.at).toISOString().slice(0,10))).size;return `<div class="panel"><h3>🧠 Persönliche FSRS-Kalibrierung</h3><p>FSRS-4.5 plant die Wiederholungen. Zusätzlich können wir anhand Ihrer tatsächlichen Erinnerungsquote einen persönlichen Stabilitätsfaktor schätzen.</p><p class="notice">${d.length} geeignete Wiederholungen · ${days} verschiedene Lerntage · Faktor: ${(state.settings.stabilityFactor||1).toFixed(2)}×</p><button class="primary full" onclick="optimizePersonal()" ${d.length<50||days<7?'disabled':''}>${d.length<50||days<7?'Nach 50 Reviews an 7 Tagen verfügbar':'Mit meinen Lerndaten kalibrieren'}</button><p class="small muted">Diese Kalibrierung passt die Intervalle an, optimiert aber noch nicht sämtliche 17 FSRS-Modellgewichte. Bereits festgelegte Termine werden nicht rückwirkend verändert. Keine zuverlässige Personalisierung ohne ausreichend verteilte Lerndaten.</p></div>`}
function stats(){let c=counts(),accuracy=c.attempts?Math.round(c.correct/c.attempts*100):0,quizzes=state.log.filter(l=>l.type==='quiz'),todayLog=state.log.filter(l=>new Date(l.at).toLocaleDateString('en-CA')===today());return `<div class="stats"><div class="stat"><div class="num">${c.correct}</div><div class="small muted">Karten richtig</div></div><div class="stat"><div class="num">${c.wrong}</div><div class="small muted">Nicht gewusst</div></div><div class="stat"><div class="num">${accuracy}%</div><div class="small muted">Erfolgsquote*</div></div><div class="stat"><div class="num">${recentDays()}</div><div class="small muted">Aktive Lerntage</div></div><div class="stat"><div class="num">${c.words}</div><div class="small muted">Wort-Antworten richtig</div></div><div class="stat"><div class="num">${c.sentences}</div><div class="small muted">Satz-Antworten richtig</div></div><div class="stat"><div class="num">${c.mastered}</div><div class="small muted">Langfristig gelernt</div></div><div class="stat"><div class="num">${quizzes.length}</div><div class="small muted">Tests absolviert</div></div><div class="stat"><div class="num">${state.log.filter(l=>l.type==='grammar'&&l.correct).length}</div><div class="small muted">Grammatik richtig</div></div><div class="stat"><div class="num">${state.log.filter(l=>l.type==='speech').length}</div><div class="small muted">Sprechversuche</div></div></div><div class="panel" style="margin-top:14px"><h3>Heute</h3><p>${todayLog.filter(l=>l.type==='card').length} Karteikarten bewertet · ${todayLog.filter(l=>l.type==='quiz').length} Tests abgeschlossen</p><h3>Kapitel</h3><div class="bar"><i style="width:${state.completed.length/chapters.length*100}%"></i></div><p class="notice">${state.completed.length} / Erweiterter Kurs selbst als abgeschlossen markiert</p><p class="notice">FSRS-4.5 mit festen Modellgewichten; optionale persönliche Intervallkalibrierung. Alte Kartenhistorie wird beim ersten neuen Review auf FSRS umgestellt. * „Richtig“ zählt Bewertungen „Gut“ und „Einfach“. „Schwer“ bedeutet erinnert, aber mit Mühe. Wiederholte richtige Antworten derselben Karte werden mehrfach gezählt; die Zahl ist nicht die Anzahl einzigartiger Vokabeln.</p></div>${calibrationPanel()}<div class="panel"><h3>Einstellungen & Datensicherung</h3><label class="small">Neue Karten pro Tag: <b id="limitValue">${state.settings.newDaily}</b></label><input style="width:100%" type="range" min="3" max="30" value="${state.settings.newDaily}" oninput="state.settings.newDaily=+this.value;document.getElementById('limitValue').textContent=this.value;save()"><p class="notice">Lernfortschritt wird nur in diesem Browser gespeichert. Sichern Sie ihn regelmässig, insbesondere vor dem Löschen von Safari-Daten.</p><button class="outline full" onclick="backup()">⬇ Backup herunterladen</button><button class="outline full" onclick="document.getElementById('restore').click()">⬆ Backup importieren</button><input id="restore" type="file" accept="application/json" style="display:none" onchange="restore(this)"></div>`}function backup(){let blob=new Blob([JSON.stringify({version:3,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bahasa-coach-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj.state||!obj.state.reviews||!Array.isArray(obj.state.log))throw Error();if(!confirm('Aktuellen Lernstand durch dieses Backup ersetzen?'))return;state=obj.state;save();render();toast('Backup importiert')}catch(e){toast('Ungültiges Backup')}};reader.readAsText(file)}
function grammarTrainer(){let ch=chapters[activeChapter];return `<div class="panel"><span class="pill">Eigenständiger Grammatiktrainer</span><h2>Grammatik verstehen und anwenden</h2><p>Erweiterter Kurs mit Regeln und aktiven Übungen. Neun Grundlagenkapitel enthalten bereits vertiefte Erklärungen zu Umgangs- und Standardsprache. Wählen Sie ein Kapitel oder starten Sie direkt.</p><select class="select" onchange="activeChapter=+this.value;render()">${chapters.map((x,i)=>`<option value="${i}" ${i===activeChapter?'selected':''}>${x.level} · ${i+1}. ${escaped(x.title)}</option>`).join('')}</select><h3>${escaped(ch.title)}</h3>${lessonPanel(ch)}<h3>Beispiele</h3>${ch.cards.filter(x=>x.type==='Satz').slice(0,4).map(x=>`<p><b>${escaped(x.id)}</b><br><span class="muted">${escaped(x.de)}</span></p>`).join('')}<button class="primary full" onclick="startGrammar(${activeChapter})">Aktive Grammatikübung starten</button></div><div class="panel"><h3>Ihr Grammatikfortschritt</h3><p>${state.log.filter(x=>x.type==='grammar').length} Übungen beantwortet · ${state.log.filter(x=>x.type==='grammar'&&x.correct).length} richtig</p><p class="notice">Die Übungen trainieren Satzbildung und das Abrufen der Grammatik im Kontext. Vertiefende Regelerklärungen und abwechslungsreichere Aufgabentypen werden weiter ausgebaut.</p></div>`}
function startGrammar(i){activeChapter=i;grammarQuestion=0;grammarScore=0;grammarAnswered=false;showGrammarQuestion()}
function showGrammarQuestion(){let ch=chapters[activeChapter],examples=ch.cards.filter(x=>x.type==='Satz');if(examples.length<2)examples=ch.cards;if(grammarQuestion>=Math.min(5,examples.length)){document.getElementById('main').innerHTML=`<div class="panel"><h2>Übung abgeschlossen</h2><p>${grammarScore} von ${Math.min(5,examples.length)} richtig.</p><button class="primary full" onclick="go('grammar')">Zur Grammatik</button></div>`;return}let x=examples[grammarQuestion];document.getElementById('main').innerHTML=`<button onclick="go('grammar')">← Grammatik</button><div class="panel"><span class="pill">${escaped(ch.title)} · ${grammarQuestion+1}/${Math.min(5,examples.length)}</span><p class="notice">${escaped(ch.grammar)}</p><h3>Übersetzen Sie ins Indonesische:</h3><h2>${escaped(x.de)}</h2><input id="grammarAnswer" class="input" autocomplete="off" placeholder="Ihre Antwort auf Indonesisch"><button class="primary full" onclick="checkGrammar()">Antwort prüfen</button><div id="grammarFeedback"></div></div>`}
function checkGrammar(){if(grammarAnswered)return;let examples=chapters[activeChapter].cards.filter(x=>x.type==='Satz');if(examples.length<2)examples=chapters[activeChapter].cards;let x=examples[grammarQuestion],answer=document.getElementById('grammarAnswer').value.trim();if(!answer)return;let ok=norm(answer)===norm(x.id);grammarScore+=ok?1:0;grammarAnswered=true;state.log.push({type:'grammar',chapter:activeChapter,correct:ok,at:Date.now()});save();document.getElementById('grammarFeedback').innerHTML=`<p class="notice">${ok?'✓ Richtig!':'Noch nicht richtig.'}<br><b>Ideallösung:</b> ${escaped(x.id)}<br>Ihre Antwort: ${escaped(answer)}</p><button class="primary full" onclick="grammarQuestion++;grammarAnswered=false;showGrammarQuestion()">Weiter →</button>`}
function compareSpeech(expected,heard){let a=norm(expected).split(' ').filter(Boolean),b=norm(heard).split(' ').filter(Boolean);let dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)dp[i][0]=i;for(let j=0;j<=b.length;j++)dp[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return Math.max(0,Math.round(100*(1-dp[a.length][b.length]/Math.max(1,a.length,b.length))))}

let activeAssessment=null;
function assessStart(chapter){
 const ch=chapters[chapter];
 const words=ch.cards.filter(c=>c.type==='Wort');
 const sentences=ch.cards.filter(c=>c.type==='Satz');
 const pool=words.length?words:ch.cards;
 const select=(arr,n)=>[...arr].sort(()=>Math.random()-.5).slice(0,n);
 const tasks=[...select(pool,3).map(c=>({kind:'translate',card:c})),...select(sentences.length?sentences:pool,1).map(c=>({kind:'listen',card:c})),...select(sentences.length?sentences:pool,1).map(c=>({kind:'produce',card:c}))];
 activeAssessment={chapter,questions:tasks.sort(()=>Math.random()-.5),at:0,results:[]};
 tab='practice';assessRender();
}
function assessRender(){
 const a=activeAssessment;if(!a)return;
 if(a.at>=a.questions.length){
  const score=a.results.filter(x=>x.correct).length,total=a.results.length;
  const record={type:'competency',chapter:a.chapter,score,total,at:Date.now(),results:a.results};
  state.log.push(record);save();
  let wrong=a.results.filter(x=>!x.correct);
  document.getElementById('main').innerHTML=`<div class="panel"><span class="pill">Kapitelabschluss · ${escaped(chapters[a.chapter].level)}</span><h2>${score}/${total} Aufgaben gelöst</h2><p>${score/total>=.8?'Gut! Sie können zum nächsten Kapitel übergehen.':'Empfehlung: Erst die unsicheren Wörter wiederholen und dann erneut testen.'}</p><p class="notice">Die Bewertung erfolgt anhand einer Musterlösung. Alternative korrekte Formulierungen können fälschlich als falsch gelten. Die Hörübung benötigt eine indonesische Systemstimme.</p>${wrong.length?`<h3>Gezielt wiederholen</h3>${wrong.map(x=>`<p><b>${escaped(x.expected)}</b> · ${escaped(x.prompt)}</p>`).join('')}`:''}<button class="primary full" onclick="assessStart(${a.chapter})">Erneut testen</button><button class="outline full" onclick="startCards(${a.chapter})">Kapitelkarten wiederholen</button><button class="outline full" onclick="openChapter(${a.chapter})">Zurück zum Kapitel</button></div>`;
  return;
 }
 const q=a.questions[a.at],c=q.card,listen=q.kind==='listen',produce=q.kind==='produce';
 const hint=listen?'Hören Sie das Wort oder den Satz und geben Sie die deutsche Bedeutung ein.':produce?'Schreiben Sie eine passende indonesische Übersetzung.':'Übersetzen Sie ins Indonesische.';
 document.getElementById('main').innerHTML=`<div class="panel"><span class="pill">Kompetenztest · ${a.at+1}/${a.questions.length}</span><h2>${escaped(chapters[a.chapter].title)}</h2><p class="muted">${hint}</p>${listen?`<button class="outline full" onclick="speak(activeAssessment.questions[activeAssessment.at].card.id)">🔊 Indonesisch anhören</button>`:`<div class="question">${escaped(c.de)}</div>`}<label class="small" for="assessAnswer">Ihre Antwort</label><input class="input" id="assessAnswer" autocomplete="off" autocapitalize="off" placeholder="Antwort eingeben" onkeydown="if(event.key==='Enter')assessCheck()"><button class="primary full" id="assessCheckBtn" onclick="assessCheck()">Antwort prüfen</button><div id="assessFeedback" aria-live="polite"></div></div>`;
}
function assessCheck(){
 const a=activeAssessment,q=a.questions[a.at],answer=document.getElementById('assessAnswer').value.trim();
 if(!answer){toast('Bitte zuerst eine Antwort eingeben');return;}
 const expected=q.kind==='listen'?q.card.de:q.card.id;
 const correct=norm(answer)===norm(expected);
 a.results.push({kind:q.kind,cardId:q.card.id,prompt:q.card.de,expected,answer,correct});
 document.getElementById('assessCheckBtn').remove();
 document.getElementById('assessFeedback').innerHTML=`<div class="answer"><b>${correct?'✓ Musterlösung getroffen':'Musterlösung nicht getroffen'}</b><p>${escaped(expected)}</p>${!correct?'<p class="small muted">Andere korrekte Antworten sind möglich. Diese Übung prüft nur die Musterlösung.</p>':''}</div><button class="primary full" onclick="activeAssessment.at++;assessRender()">${a.at===a.questions.length-1?'Ergebnis ansehen':'Nächste Aufgabe →'}</button>`;
}

function v17Clean(s){return norm(String(s||'')).replace(/[;:()\[\]"“”]/g,'').replace(/\s+/g,' ').trim()}
function v17Variants(expected){

 const variants=[source];
 // Alternatives separated by semicolons are legitimate if explicitly supplied.
 if(source.includes(';'))variants.push(...source.split(';').map(x=>x.trim()));
